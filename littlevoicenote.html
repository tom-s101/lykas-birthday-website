<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For When You Miss My Voice — Lyka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --rose: #c4727f;
    --rose-light: #e8a0aa;
    --rose-pale: #f5dde0;
    --sage: #8a9a7b;
    --sage-pale: #e4ebe0;
    --cream: #faf8f5;
    --warm: #f5f0eb;
    --text: #3a3535;
    --text-light: #7a7070;
    --text-faint: #b0a5a5;
    --gold: #d4a574;
}

html { scroll-behavior: smooth; }

body {
    min-height: 100svh;
    background: var(--cream);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

/* ── Soft background blobs (same motif as the main page hero) ── */
.bg-blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg-blobs .blob {
    position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4;
    animation: drift 20s ease-in-out infinite alternate;
}
.bg-blobs .blob:nth-child(1) { width: 60vw; height: 60vw; max-width: 500px; max-height: 500px; background: var(--rose-pale); top: -10%; right: -15%; }
.bg-blobs .blob:nth-child(2) { width: 50vw; height: 50vw; max-width: 400px; max-height: 400px; background: var(--sage-pale); bottom: -5%; left: -10%; animation-delay: -7s; }
@keyframes drift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(30px,-20px) scale(1.05); } }

/* ── Page shell ── */
.page {
    position: relative; z-index: 1;
    min-height: 100svh;
    display: flex; flex-direction: column;
    align-items: center;
}

/* ── Nav ── */
.topnav {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2rem 1.5rem;
    flex-shrink: 0;
}
.back-link {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase;
    color: var(--rose); text-decoration: none;
    transition: color 0.25s;
}
.back-link:hover { color: var(--text); }
.back-link svg { width: 12px; height: 12px; }

/* ── States ── */
.state-screen {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 2rem;
}
.empty-icon { width: 52px; height: 52px; color: var(--rose-light); opacity: 0.6; margin-bottom: 1.5rem; }
.state-heading {
    font-family: 'Cormorant Garamond', serif; font-weight: 400; font-style: italic;
    font-size: 1.5rem; color: var(--text); margin-bottom: 0.5rem;
}
.state-sub { font-size: 0.78rem; color: var(--text-light); line-height: 1.6; }
.loading-dots span {
    display: inline-block; width: 6px; height: 6px;
    background: var(--rose-light); border-radius: 50%; margin: 0 3px;
    animation: dot-pulse 1.4s ease-in-out infinite;
}
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot-pulse {
    0%,80%,100% { opacity: 0.2; transform: scale(0.9); }
    40% { opacity: 1; transform: scale(1.2); }
}

/* ── Player ── */
#statePlayer {
    width: 100%; max-width: 480px;
    display: flex; flex-direction: column;
    align-items: center;
    flex: 1;
    padding: 0 1.5rem 5.5rem;
}

.player-header {
    text-align: center; padding: 1.5rem 0 2.5rem; width: 100%;
    opacity: 0; animation: fadeUp 1s ease 0.2s forwards;
}
.player-label {
    font-size: 0.6rem; letter-spacing: 3px; text-transform: uppercase;
    color: var(--sage); margin-bottom: 0.9rem;
}
.main-heading {
    font-family: 'Cormorant Garamond', serif; font-weight: 400;
    font-size: clamp(1.9rem, 6vw, 2.5rem); line-height: 1.3; color: var(--text);
    margin-bottom: 0.8rem;
}
.main-heading em { font-style: italic; color: var(--gold); }
.player-sub {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 1rem; color: var(--text-light);
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

.time-row {
    font-size: 0.68rem; letter-spacing: 2px;
    color: var(--text-faint);
    margin-top: 1rem;
}

/* ── Waveform ── */
.waveform-area { width: 100%; height: 68px; margin-top: 0.5rem; cursor: pointer; }
#waveformCanvas { width: 100%; height: 100%; display: block; }

/* ── Heart player ── */
.heart-player {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    width: 180px; height: 180px;
    margin: 1.6rem auto 0;
    flex-shrink: 0;
}

.ring {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid rgba(196,114,127,0);
    width: 100%; height: 100%;
    pointer-events: none;
    transform: scale(0.5);
}
.heart-player.playing .ring { animation: ring-sonar 2.4s ease-out infinite; }
.heart-player.playing .ring:nth-child(2) { animation-delay: 0.8s; }
.heart-player.playing .ring:nth-child(3) { animation-delay: 1.6s; }
@keyframes ring-sonar {
    0%   { transform: scale(0.55); border-color: rgba(196,114,127,0.5); }
    100% { transform: scale(1.7);  border-color: rgba(196,114,127,0); }
}

.orbit-container {
    position: absolute; inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
}
.heart-player.playing .orbit-container { opacity: 1; }
.orbit-dot {
    position: absolute;
    width: 7px; height: 7px;
    background: var(--rose-light);
    border-radius: 50%;
    top: 50%; left: 50%;
    transform-origin: 0 0;
}
.heart-player.playing .orbit-dot:nth-child(1) { animation: orbit 2.8s linear infinite; }
.heart-player.playing .orbit-dot:nth-child(2) { animation: orbit 2.8s linear infinite 0.7s; }
.heart-player.playing .orbit-dot:nth-child(3) { animation: orbit 2.8s linear infinite 1.4s; }
.heart-player.playing .orbit-dot:nth-child(4) { animation: orbit 2.8s linear infinite 2.1s; }
@keyframes orbit {
    0%   { transform: rotate(0deg)   translateX(72px) translateX(-3.5px) translateY(-3.5px); opacity: 0.9; }
    50%  { opacity: 0.4; }
    100% { transform: rotate(360deg) translateX(72px) translateX(-3.5px) translateY(-3.5px); opacity: 0.9; }
}

.heart-btn {
    position: relative; z-index: 2;
    width: 84px; height: 84px;
    background: radial-gradient(circle at 40% 38%, #d4808d, #c4727f 60%, #a85b68);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    touch-action: none;
    border: none; outline: none;
    box-shadow:
        0 0 0 5px rgba(196,114,127,0.14),
        0 8px 28px rgba(196,114,127,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.heart-btn svg { width: 38px; height: 38px; pointer-events: none; }
.heart-player.playing .heart-btn {
    animation: heart-pulse 1.1s ease-in-out infinite;
    box-shadow:
        0 0 0 8px rgba(196,114,127,0.1),
        0 10px 36px rgba(196,114,127,0.5);
}
@keyframes heart-pulse {
    0%,100% { transform: scale(1); }
    45%     { transform: scale(1.1); }
}
.heart-btn:active { transform: scale(0.94); }

.hold-hint {
    margin-top: 1.4rem;
    font-size: 0.62rem; letter-spacing: 3px; text-transform: uppercase;
    color: var(--rose);
    text-align: center;
    transition: opacity 0.35s ease;
}

/* ── Click-to-play button ── */
.click-play-btn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    margin: 1.6rem auto 0;
    background: var(--rose);
    color: #fff;
    border: none;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1rem;
    letter-spacing: 0.5px;
    padding: 0.7rem 1.8rem;
    border-radius: 100px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(196,114,127,0.3);
    transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
}
.click-play-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(196,114,127,0.4); }
.click-play-btn:active { transform: translateY(0); }
.click-play-btn svg { width: 15px; height: 15px; }

/* ── Replay button ── */
.replay-btn {
    display: block; margin: 1rem auto 0;
    background: none; border: 1px solid var(--rose-pale);
    color: var(--rose); font-family: 'Cormorant Garamond', serif;
    font-size: 0.88rem; letter-spacing: 3px; text-transform: uppercase;
    padding: 0.45rem 1.4rem; border-radius: 20px; cursor: pointer;
    transition: border-color 0.3s, color 0.3s;
}
.replay-btn:hover { border-color: var(--rose); color: var(--text); }

footer {
    position: relative; z-index: 1;
    text-align: center;
    padding: 0 1rem 2.5rem;
    font-size: 0.6rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-faint);
}
footer span { color: var(--rose); }
</style>
</head>
<body>

<div class="bg-blobs"><div class="blob"></div><div class="blob"></div></div>

<div class="page" id="page">
    <nav class="topnav">
        <a href="index.html#return" class="back-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            back
        </a>
    </nav>

    <!-- Loading -->
    <div class="state-screen" id="stateLoading">
        <div class="loading-dots" style="margin-bottom:1rem">
            <span></span><span></span><span></span>
        </div>
        <p class="state-sub">loading your voice note…</p>
    </div>

    <!-- Empty -->
    <div class="state-screen" id="stateEmpty" style="display:none">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
        <h1 class="state-heading">a little voice note is on its way…</h1>
        <p class="state-sub">check back soon ♡</p>
    </div>

    <!-- Player -->
    <div id="statePlayer" style="display:none">

        <div class="player-header">
            <p class="player-label">just a little something</p>
            <h1 class="main-heading">For when you miss <em>hearing my voice</em></h1>
            <p class="player-sub">press play, and I'm right here.</p>
            <div class="time-row">
                <span id="timeCurrent">0:00</span>
                <span style="margin:0 0.3em">/</span>
                <span id="timeTotal">0:00</span>
            </div>
        </div>

        <!-- Waveform (tap to seek) -->
        <div class="waveform-area" id="waveformArea">
            <canvas id="waveformCanvas"></canvas>
        </div>

        <!-- Heart hold-to-play button -->
        <div class="heart-player" id="heartPlayer">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="orbit-container">
                <div class="orbit-dot"></div>
                <div class="orbit-dot"></div>
                <div class="orbit-dot"></div>
                <div class="orbit-dot"></div>
            </div>
            <button class="heart-btn" id="heartBtn" aria-label="Hold to listen">
                <svg viewBox="0 0 30 27" fill="none">
                    <path d="M15 25.5C15 25.5 2.5 17.5 2 9.5C1.7 5.5 4.5 2 8.5 2C11.2 2 13.5 3.8 15 6C16.5 3.8 18.8 2 21.5 2C25.5 2 28.3 5.5 28 9.5C27.5 17.5 15 25.5 15 25.5Z" fill="white" stroke="rgba(255,255,255,0.4)" stroke-width="0.5"/>
                    <path d="M8.5 6.5C7 8 6 10 6.5 12.5" stroke="rgba(255,255,255,0.35)" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </button>
        </div>

        <p class="hold-hint" id="holdHint">hold ♡ to listen</p>

        <!-- Click-to-play (no holding required) -->
        <button class="click-play-btn" id="clickPlayBtn">
            <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v14l11-7-11-7z"/></svg>
            <span id="clickPlayLabel">click to play</span>
        </button>

        <button class="replay-btn" id="replayBtn" style="display:none">replay ↩</button>
    </div>

    <footer>made with <span>&hearts;</span> for you</footer>
</div>


<script>
(function() {
'use strict';

var SB_URL = 'https://vforizrevnrzbzkwtdbc.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmb3JpenJldm5yemJ6a3d0ZGJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5Mzk4NzIsImV4cCI6MjA5NzUxNTg3Mn0.VchST6lQCv7LrCZc3reuVa0HIpgFsfJ8jfwrRyu6PxQ';
var CONTENT_KEY = 'little_voice_note_url';

function sbGet(path) {
    return fetch(SB_URL + path, {
        headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
    });
}

// ── Elements ──
var elLoading   = document.getElementById('stateLoading');
var elEmpty     = document.getElementById('stateEmpty');
var elPlayer    = document.getElementById('statePlayer');
var waveCanvas  = document.getElementById('waveformCanvas');
var waveArea    = document.getElementById('waveformArea');
var heartPlayer = document.getElementById('heartPlayer');
var heartBtn    = document.getElementById('heartBtn');
var holdHint    = document.getElementById('holdHint');
var replayBtn   = document.getElementById('replayBtn');
var clickPlayBtn   = document.getElementById('clickPlayBtn');
var clickPlayLabel = document.getElementById('clickPlayLabel');
var timeCurrent = document.getElementById('timeCurrent');
var timeTotal   = document.getElementById('timeTotal');

// ── State ──
var audio        = null;
var waveformBars = [];
var isPlaying    = false;
var raf          = null;

function fmt(s) {
    if (!s || isNaN(s) || !isFinite(s)) return '0:00';
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function showState(s) {
    elLoading.style.display = 'none';
    elEmpty.style.display   = 'none';
    elPlayer.style.display  = 'none';
    if (s === 'loading') elLoading.style.display = 'flex';
    if (s === 'empty')   elEmpty.style.display   = 'flex';
    if (s === 'player')  elPlayer.style.display  = 'flex';
}

// ── Init ──
async function init() {
    try {
        var r = await sbGet('/rest/v1/site_content?key=eq.' + CONTENT_KEY + '&select=value');
        var rows = await r.json();
        var vnUrl = rows && rows[0] ? rows[0].value : null;
        if (!vnUrl) { showState('empty'); return; }

        audio = new Audio();
        audio.crossOrigin = 'anonymous';
        audio.preload = 'auto';

        await new Promise(function(resolve, reject) {
            audio.addEventListener('loadedmetadata', resolve, { once: true });
            audio.addEventListener('error', reject, { once: true });
            audio.src = vnUrl;
        });

        timeTotal.textContent = fmt(audio.duration);
        showState('player');
        drawWaveform(0);

        decodeWaveform(vnUrl).then(function(bars) {
            waveformBars = bars;
            var frac = audio ? (audio.currentTime / (audio.duration || 1)) : 0;
            drawWaveform(frac);
        });

        audio.addEventListener('ended', function() {
            pauseAudio();
            drawWaveform(1);
            replayBtn.style.display = 'block';
            holdHint.style.display = 'none';
            clickPlayBtn.style.display = 'none';
        });

        replayBtn.addEventListener('click', function() {
            replayBtn.style.display = 'none';
            holdHint.style.display = '';
            clickPlayBtn.style.display = '';
            audio.currentTime = 0;
            drawWaveform(0);
            timeCurrent.textContent = '0:00';
        });

    } catch(e) {
        console.error(e);
        showState('empty');
    }
}

// ── Waveform ──
async function decodeWaveform(url) {
    var N = 80;
    try {
        var resp = await fetch(url, { mode: 'cors' });
        var buf  = await resp.arrayBuffer();
        var actx = new (window.AudioContext || window.webkitAudioContext)();
        var decoded = await actx.decodeAudioData(buf);
        actx.close();
        var raw = decoded.getChannelData(0);
        var blockSize = Math.floor(raw.length / N);
        var bars = [];
        for (var i = 0; i < N; i++) {
            var sum = 0;
            for (var j = 0; j < blockSize; j++) sum += Math.abs(raw[i * blockSize + j]);
            bars.push(sum / blockSize);
        }
        var max = Math.max.apply(null, bars);
        return bars.map(function(b) { return Math.max(0.05, b / max); });
    } catch(e) {
        return fakeBars(N);
    }
}

function fakeBars(N) {
    var out = [];
    for (var i = 0; i < N; i++) {
        var t = i / N;
        var base = 0.15 + 0.7 * Math.sin(t * Math.PI) * (0.6 + 0.4 * Math.sin(t * Math.PI * 7));
        out.push(Math.max(0.05, Math.min(1, base * (0.65 + Math.random() * 0.35))));
    }
    return out;
}

function drawWaveform(frac) {
    var dpr = window.devicePixelRatio || 1;
    var W = waveArea.clientWidth;
    var H = waveArea.clientHeight;
    waveCanvas.width  = W * dpr;
    waveCanvas.height = H * dpr;
    var ctx = waveCanvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, W, H);

    if (!waveformBars.length) waveformBars = fakeBars(80);

    var N = waveformBars.length;
    var barW = W / N;
    var playX = frac * W;

    waveformBars.forEach(function(h, i) {
        var x   = i * barW;
        var bh  = Math.max(3, h * H * 0.84);
        var by  = (H - bh) / 2;
        var bx  = x + 1;
        var bw  = barW - 2;
        var r   = Math.min(2.5, bw / 2);
        var mid = x + barW / 2;
        ctx.fillStyle = mid < playX ? '#c4727f' : 'rgba(196,114,127,0.14)';
        rrect(ctx, bx, by, bw, bh, r);
        ctx.fill();
    });

    if (frac > 0 && frac < 1) {
        var gx  = frac * W;
        var grd = ctx.createLinearGradient(gx - 12, 0, gx + 12, 0);
        grd.addColorStop(0,   'rgba(196,114,127,0)');
        grd.addColorStop(0.5, 'rgba(196,114,127,0.22)');
        grd.addColorStop(1,   'rgba(196,114,127,0)');
        ctx.fillStyle = grd;
        ctx.fillRect(gx - 12, 0, 24, H);
    }
}

function rrect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

// ── Animation loop ──
function startLoop() {
    cancelAnimationFrame(raf);
    function tick() {
        if (!audio) return;
        var frac = audio.currentTime / (audio.duration || 1);
        drawWaveform(frac);
        timeCurrent.textContent = fmt(audio.currentTime);
        if (isPlaying && !audio.paused) raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
}

// ── Play / pause (shared by hold-heart and click-to-play) ──
function playAudio() {
    if (!audio || isPlaying) return;
    isPlaying = true;
    heartPlayer.classList.add('playing');
    holdHint.style.opacity = '0';
    clickPlayLabel.textContent = 'tap to pause';
    audio.play().catch(function(){});
    startLoop();
}

function pauseAudio() {
    if (!isPlaying) return;
    isPlaying = false;
    heartPlayer.classList.remove('playing');
    holdHint.style.opacity = '1';
    clickPlayLabel.textContent = 'click to play';
    if (audio) audio.pause();
    cancelAnimationFrame(raf);
    if (audio) drawWaveform(audio.currentTime / (audio.duration || 1));
}

// Hold-to-play heart button
heartBtn.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    heartBtn.setPointerCapture(e.pointerId);
    playAudio();
});
heartBtn.addEventListener('pointerup',     function() { pauseAudio(); });
heartBtn.addEventListener('pointercancel', function() { pauseAudio(); });
heartBtn.addEventListener('lostpointercapture', function() { pauseAudio(); });

// Click-to-play button (no holding required)
clickPlayBtn.addEventListener('click', function() {
    if (isPlaying) pauseAudio();
    else playAudio();
});

// Tap waveform to seek
waveArea.addEventListener('click', function(e) {
    if (!audio || !audio.duration) return;
    var rect = waveArea.getBoundingClientRect();
    var frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    audio.currentTime = frac * audio.duration;
    timeCurrent.textContent = fmt(audio.currentTime);
    drawWaveform(frac);
});

window.addEventListener('resize', function() {
    if (audio) drawWaveform(audio.currentTime / (audio.duration || 1));
});

init();
})();
</script>
</body>
</html>
