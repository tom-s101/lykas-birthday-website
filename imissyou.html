<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>When You Miss Seeing Me — Lyka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --rose: #c4727f;
    --rose-light: #e8a0aa;
    --rose-pale: #f5dde0;
    --sage: #8a9a7b;
    --sage-pale: #e4ebe0;
    --cream: #faf8f5;
    --warm: #f5f0eb;
    --text: #3a3535;
    --text-light: #7a7070;
    --text-faint: #b0a5a5;
    --gold: #d4a574;
}

html { scroll-behavior: smooth; }

body {
    min-height: 100svh;
    background: var(--cream);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

/* ── Soft background blobs (same motif as the main page hero) ── */
.bg-blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg-blobs .blob {
    position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4;
    animation: drift 20s ease-in-out infinite alternate;
}
.bg-blobs .blob:nth-child(1) { width: 60vw; height: 60vw; max-width: 500px; max-height: 500px; background: var(--rose-pale); top: -10%; right: -15%; }
.bg-blobs .blob:nth-child(2) { width: 50vw; height: 50vw; max-width: 400px; max-height: 400px; background: var(--sage-pale); bottom: -5%; left: -10%; animation-delay: -7s; }
@keyframes drift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(30px,-20px) scale(1.05); } }

/* ── Page shell ── */
.page {
    position: relative; z-index: 1;
    min-height: 100svh;
    display: flex; flex-direction: column;
    align-items: center;
}

/* ── Nav ── */
.topnav {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2rem 1.5rem;
    flex-shrink: 0;
}
.back-link {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase;
    color: var(--rose); text-decoration: none;
    transition: color 0.25s;
}
.back-link:hover { color: var(--text); }
.back-link svg { width: 12px; height: 12px; }

/* ── Content ── */
.content {
    position: relative; z-index: 1;
    width: 100%; max-width: 480px;
    flex: 1;
    display: flex; flex-direction: column; align-items: center;
    padding: 0.5rem 1.5rem 4.5rem;
}

.page-header {
    text-align: center; padding: 1.5rem 0 2.5rem; width: 100%;
    opacity: 0; animation: fadeUp 1s ease 0.2s forwards;
}
.page-label {
    font-size: 0.6rem; letter-spacing: 3px; text-transform: uppercase;
    color: var(--sage); margin-bottom: 0.9rem;
}
.main-heading {
    font-family: 'Cormorant Garamond', serif; font-weight: 400;
    font-size: clamp(1.9rem, 6vw, 2.5rem); line-height: 1.3; color: var(--text);
    margin-bottom: 0.8rem;
}
.main-heading em { font-style: italic; color: var(--gold); }
.page-sub {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 1rem; color: var(--text-light);
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

/* ── Video (vertical, for a YouTube Short) ── */
.video-wrap {
    position: relative;
    width: 100%;
    max-width: 320px;
    margin: 0 auto;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 34px rgba(196,114,127,0.22), 0 2px 10px rgba(0,0,0,0.08);
    background: #000;
    opacity: 0;
    animation: fadeUp 1s ease 0.5s forwards;
}
.video-wrap::before {
    content: '';
    display: block;
    padding-top: 177.78%; /* 9:16 */
}
.video-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
}
.video-wrap.visible { transform: none; }

footer {
    position: relative; z-index: 1;
    text-align: center;
    padding: 0 1rem 2.5rem;
    font-size: 0.6rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-faint);
}
footer span { color: var(--rose); }
</style>
</head>
<body>

<div class="bg-blobs"><div class="blob"></div><div class="blob"></div></div>

<div class="page" id="page">
    <nav class="topnav">
        <a href="index.html#return" class="back-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            back
        </a>
    </nav>

    <div class="content">
        <div class="page-header">
            <p class="page-label">just a little something</p>
            <h1 class="main-heading">When you miss <em>seeing me</em></h1>
            <p class="page-sub">just a little video for YOU</p>
        </div>

        <div class="video-wrap" id="videoWrap"></div>
    </div>

    <footer>made with <span>&hearts;</span> for you</footer>
</div>

<script>
(function() {
    var YOUTUBE_ID = 'Ynct1gvnmg4';
    var wrap = document.getElementById('videoWrap');
    if (!wrap || !YOUTUBE_ID) return;
    var iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube.com/embed/' + YOUTUBE_ID + '?rel=0&playsinline=1';
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen = true;
    iframe.setAttribute('allowfullscreen', '');
    wrap.appendChild(iframe);
    setTimeout(function() { wrap.classList.add('visible'); }, 50);
})();
</script>
</body>
</html>
